[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry-api-scanner"
version = "0.1.0"
description = "Silent API security header scanner"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Yash Saran", email = "yashsaran0911@gmail.com" }]
requires-python = ">=3.11"
keywords = ["security", "api", "scanner", "headers", "pentesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    # 12.x required: core/interceptor.py passes loop= to DumpMaster and depends
    # on the 12.x get_running_loop() startup behaviour.
    "mitmproxy>=12.0",
    "playwright>=1.40",
    "click>=8.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "requests>=2.31",
    "reportlab>=4.0",
    "pillow>=10.0",
]

[project.scripts]
sentryscan = "sentry.main:cli"
# Optional one-time setup: caches display environment and installs Chromium
# when a display is detected. NOT required — sentry works immediately after
# pip install. Run this to pre-warm everything so the first passive scan
# does not incur the Chromium download delay.
sentry-setup = "sentry.config.environment:setup"
# Individual commands kept for .deb postinst and advanced use.
sentry-detect-env = "sentry.config.environment:detect_and_save"
sentry-install-browser = "sentry.config.environment:install_chromium_if_passive"

[project.urls]
Repository = "https://github.com/ys0911-sudo/sentry"
"Bug Tracker" = "https://github.com/ys0911-sudo/sentry/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentry*"]

[tool.setuptools.package-data]
"sentry.config" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]
